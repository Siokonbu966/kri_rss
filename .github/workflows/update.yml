name: update-rss
on:
    schedule:
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on:  ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: DeterminateSystems/nix-installer-action@v3
            - uses: DeterminateSystems/magic-nix-cache-action@v3
            - run: nix develop --command python rss.py
